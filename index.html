<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бекер сынамык ЖРТ — NOVA Up</title>
<meta name="description" content="Бекер онлайн сынамык ЖРТ (ОРТ) чыныгы форматта: математика, аналогиялар, окуу жана түшүнүү, практикалык грамматика. Болжолдуу балл жана толук анализ.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#4A0E22">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NOVA Up">
<meta property="og:url" content="https://novaup.net/">
<meta property="og:title" content="Бекер сынамык ЖРТ онлайн — NOVA Up">
<meta property="og:description" content="150 суроо, 3 саат 35 мүнөт, чыныгы формат. Болжолдуу балл жана темалар боюнча толук анализ.">
<meta property="og:image" content="https://novaup.net/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bordo:#4A0E22;--bordo2:#6E1A36;--dark:#1E0A12;--gold:#F5C451;--gold2:#B8892A;--cream:#FBF3E4;--pink:#D9A7B4;--ok:#2E7D32;--bad:#C62828;--line:#e3cfd6;--mut:#8a6a74}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--dark);color:#fff;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 80% -10%,rgba(245,196,81,.22),transparent 55%),linear-gradient(160deg,var(--bordo2),var(--bordo) 45%,var(--dark))}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
header img{height:34px}
.lang{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;font:600 13px Montserrat;padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--gold);color:var(--dark)}
.card{background:var(--cream);color:var(--dark);border-radius:20px;padding:22px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card+.card{margin-top:14px}
.hero h1{font-size:30px;line-height:1.15;font-weight:800;margin:6px 0 12px}
.hero h1 span{color:var(--gold)}
.hero p{color:#f3e3e8;font-size:15px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(245,196,81,.35);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select{width:100%;font:500 16px Montserrat;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--dark);outline:none}
input:focus,select:focus{border-color:var(--bordo2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;font:600 15px Montserrat;color:var(--dark);cursor:pointer}
.seg button.on{background:var(--bordo);border-color:var(--bordo);color:#fff}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#6b4a55;margin-top:14px;line-height:1.4}
.agree input{width:20px;height:20px;flex:none;margin-top:1px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:800 17px Montserrat;cursor:pointer;margin-top:18px;background:linear-gradient(180deg,#FFD873,var(--gold));color:var(--dark);box-shadow:0 8px 20px rgba(245,196,81,.35);text-align:center;text-decoration:none}
.btn.ghost{background:transparent;border:2px solid var(--bordo);color:var(--bordo);box-shadow:none}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:16px;line-height:1.4}
.muted{color:var(--mut);font-size:13px;line-height:1.45}
.top{position:sticky;top:0;z-index:5;background:rgba(30,10,18,.94);backdrop-filter:blur(8px);margin:-18px -16px 16px;padding:12px 16px}
.top .t1{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:14px}
.timer{flex:none;background:var(--gold);color:var(--dark);border-radius:999px;padding:4px 11px;font-variant-numeric:tabular-nums}
.timer.low{background:#ff6b6b;color:#fff}
.bar{height:5px;background:rgba(255,255,255,.15);border-radius:9px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.qn{font-size:13px;font-weight:700;color:var(--bordo2);letter-spacing:.3px}
.part{display:inline-block;font-size:12px;font-weight:700;color:var(--gold2);margin-left:6px}
.cond{font-size:15px;color:#6b4a55;margin:10px 0 4px;line-height:1.45}
.qtext{font-size:17px;font-weight:600;line-height:1.5;margin:10px 0 14px;white-space:pre-line}
.pair{font-size:22px;font-weight:800;text-align:center;margin:12px 0 16px;color:var(--bordo)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px}
.cmp div{border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;background:#fff}
.cmp b{display:block;font-size:11px;color:var(--mut);margin-bottom:6px;letter-spacing:.4px}
.cmp span{font-size:18px;font-weight:700;line-height:1.35}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:500 16px/1.4 Montserrat;color:var(--dark);cursor:pointer}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:#f3e6ea;display:grid;place-items:center;font-weight:800;color:var(--bordo)}
.opt.on{border-color:var(--bordo);background:#fff4f6}
.opt.on .l{background:var(--bordo);color:#fff}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .btn{margin-top:0}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font:700 12px Montserrat;color:var(--mut);cursor:pointer}
.dots button.done{background:#f3e6ea;color:var(--bordo)}
.dots button.cur{border-color:var(--bordo);color:var(--bordo)}
.intro{white-space:pre-line;font-size:15px;line-height:1.6;margin:10px 0 4px}
.txtbtn{display:flex;align-items:center;justify-content:space-between;width:100%;border:1.5px dashed var(--bordo2);background:#fff;border-radius:12px;padding:11px 14px;font:700 14px Montserrat;color:var(--bordo);cursor:pointer;margin-top:10px}
.text{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 12px;margin-top:10px;max-height:58vh;overflow:auto;font-size:14px;line-height:1.55}
.text h4{font-size:15px;margin:4px 0 8px;color:var(--bordo)}
.text .ln{display:grid;grid-template-columns:26px 1fr;gap:6px}
.text .ln i{font-style:normal;font-size:11px;color:var(--mut);text-align:right;padding-top:3px}
/* результат */
.big{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.big b{font-size:64px;font-weight:800;color:var(--bordo);line-height:1}
.big small{font-size:20px;color:var(--mut);font-weight:700}
.scale{position:relative;height:12px;border-radius:9px;background:linear-gradient(90deg,#e9c6cf,#f5c451 55%,#2e7d32);margin:22px 0 30px}
.scale .me{position:absolute;top:-7px;width:4px;height:26px;background:var(--dark);border-radius:3px;transform:translateX(-2px)}
.scale .mk{position:absolute;top:16px;font-size:11px;color:var(--mut);transform:translateX(-50%);white-space:nowrap}
.scale .mk::before{content:'';position:absolute;left:50%;top:-6px;width:1px;height:6px;background:var(--mut)}
.badge{display:inline-block;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;margin:4px 6px 0 0}
.badge.ok{background:#e3f1e4;color:var(--ok)}.badge.no{background:#fbe3e3;color:var(--bad)}.badge.g{background:#fff1c9;color:#7a5a00}
h3.h{font-size:17px;margin:2px 0 10px}
.rows{display:grid;gap:10px}
.rw{background:#fff;border-radius:14px;padding:12px 14px}
.rw .h{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
.rw .h span:last-child{white-space:nowrap}
.rw .b{height:8px;background:#f3e6ea;border-radius:9px;margin-top:8px;overflow:hidden}
.rw .b i{display:block;height:100%;background:var(--bordo)}
.rw .s{font-size:12px;color:var(--mut);margin-top:6px}
.cells{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cells span{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.cells .y{background:var(--ok)}.cells .n{background:var(--bad)}.cells .s{background:#bdb3b6}
.tp{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid #f0e2e6}
.tp:last-child{border:0}
.tp .b{grid-column:1/-1;height:6px;background:#f3e6ea;border-radius:9px;overflow:hidden}
.tp .b i{display:block;height:100%}
.tip{background:#fff;border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5;margin-top:8px}
details{background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px}
summary{cursor:pointer;font-weight:700;font-size:14px;line-height:1.4}
details p{font-size:14px;line-height:1.5;margin-top:8px}
.cta{background:var(--bordo);color:#fff;border-radius:16px;padding:18px;margin-top:16px}
.cta h3{font-size:18px;margin-bottom:6px}
.cta p{color:#f3e3e8;font-size:14px;line-height:1.5}
/* выбор режима */
.seg.modes{grid-template-columns:1fr 1fr}
.seg.modes button{padding:11px 8px;line-height:1.3;font-size:14px}
.seg.modes button small{display:block;font-weight:500;font-size:12px;opacity:.8;margin-top:3px}
/* буклет в режиме «лист ответов» */
.opt.ro{cursor:default}
.opt.ro .l{background:transparent;border:1.5px solid var(--line);color:var(--bordo)}
.booknote{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.4}
/* лист ответов */
body.sheetmode .wrap{padding-bottom:120px}
.sheetbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;color:var(--dark);border-top:3px solid var(--gold);box-shadow:0 -10px 30px rgba(0,0,0,.35);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.sheetbar .in{max-width:680px;margin:0 auto}
.sb1{display:flex;align-items:center;gap:10px}
.sb1 .cap{font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.4px;line-height:1.2}
.sbn{flex:none;font-weight:800;font-size:18px;color:var(--bordo);min-width:40px}
.bub{display:flex;gap:7px;flex:1}
.bub button{width:38px;height:38px;border-radius:50%;border:2px solid #8a6a74;background:#fff;font:700 13px Montserrat;color:#8a6a74;cursor:pointer;display:grid;place-items:center;padding:0}
.bub button.f{background:#1b1b2f;border-color:#1b1b2f;color:#1b1b2f}
.bub button.sq{border-radius:5px;outline:3px solid #1b1b2f;outline-offset:-1px;border-color:#1b1b2f;color:#1b1b2f;font-weight:800}
.bub button.f.dead{background:#1b1b2f;opacity:.55}
.sb-all{flex:none;border:1.5px solid var(--bordo);background:#fff;color:var(--bordo);font:700 13px Montserrat;border-radius:10px;padding:9px 10px;cursor:pointer}
.sbmsg{font-size:12px;color:var(--bad);min-height:0;margin-top:4px;line-height:1.35}
.sheetov{position:fixed;inset:0;z-index:30;background:rgba(10,4,8,.7);display:flex;justify-content:center;align-items:flex-end}
.sheetbox{background:#fff;color:var(--dark);width:100%;max-width:680px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-14px;background:#fff;padding:4px 0 8px;z-index:1}
.sh-h b{font-size:15px}
.sh-h button{border:0;background:#f3e6ea;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.sh-help{font-size:12px;color:#6b4a55;line-height:1.45;background:#fbf3e4;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.sh-help .ex{display:inline-flex;gap:4px;vertical-align:middle;margin:0 2px}
.sh-help .ex i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid #8a6a74}
.sh-help .ex i.f{background:#1b1b2f;border-color:#1b1b2f}.sh-help .ex i.sq{border-radius:3px;border:2.5px solid #1b1b2f}
.sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.sh-sub{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--gold2);margin:8px 0 2px;letter-spacing:.3px}
.sh-row{display:flex;align-items:center;gap:5px;padding:3px 4px;border-radius:8px}
.sh-row.cur{background:#fff4d6}
.sh-row>span{width:24px;flex:none;font-size:12px;font-weight:700;color:var(--mut);text-align:right}
.sh-row .bub{gap:4px}
.sh-row .bub button{width:26px;height:26px;font-size:10px;border-width:1.5px}
@media(max-width:400px){.sh-grid{grid-template-columns:1fr}.bub button{width:34px;height:34px}}
.resume{background:#fff4d6;border:1.5px solid var(--gold2);border-radius:14px;padding:14px;margin-bottom:14px;color:var(--dark)}
.resume .nav .btn{padding:12px;font-size:15px}
.hide{display:none!important}
footer{text-align:center;color:#d9a7b4;font-size:12px;margin-top:22px;line-height:1.5}
@media(max-width:380px){.cmp{grid-template-columns:1fr}.big b{font-size:54px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <header>
    <img src="img/logo.png" alt="NOVA Up">
    <div class="lang"><button data-l="ky" class="on">KG</button><button data-l="ru">RU</button></div>
  </header>

  <section id="s-form">
    <div class="hero">
      <h1 data-t="h1"></h1>
      <p data-t="lead"></p>
      <div class="chips"><span class="chip" data-t="c1"></span><span class="chip" data-t="c2"></span><span class="chip" data-t="c3"></span><span class="chip" data-t="c4"></span></div>
    </div>
    <div class="resume hide" id="resume">
      <b data-t="resH"></b>
      <p class="muted" style="margin-top:4px" id="resume-info"></p>
      <div class="nav" style="margin-top:10px"><button class="btn" id="resume-go" data-t="resGo"></button><button class="btn ghost" id="resume-no" data-t="resNo"></button></div>
    </div>
    <div class="card">
      <b style="font-size:18px" data-t="formTitle"></b>
      <p class="muted" style="margin-top:4px" data-t="formSub"></p>
      <label for="f-name" data-t="fName"></label>
      <input id="f-name" autocomplete="name">
      <label for="f-phone" data-t="fPhone"></label>
      <input id="f-phone" type="tel" inputmode="tel" placeholder="0700 123 456" autocomplete="tel">
      <label data-t="fClass"></label>
      <div class="seg" id="f-class"><button>9</button><button>10</button><button>11</button><button data-t="grad" data-v="grad"></button></div>
      <div class="row">
        <div><label for="f-region" data-t="fRegion"></label><select id="f-region"></select></div>
        <div><label for="f-city" data-t="fCity"></label><input id="f-city"></div>
      </div>
      <label data-t="fLang"></label>
      <div class="seg two" id="f-tlang"><button data-v="ky">Кыргызча</button><button data-v="ru">Русский</button></div>
      <label data-t="fMode"></label>
      <div class="seg modes" id="f-mode"><button data-v="full" class="on" data-t="mFull"></button><button data-v="short" data-t="mShort"></button></div>
      <label data-t="fFill"></label>
      <div class="seg modes" id="f-fill"><button data-v="sheet" class="on" data-t="fSheet"></button><button data-v="tap" data-t="fTap"></button></div>
      <div class="agree"><input type="checkbox" id="f-ok"><span data-t="agree"></span></div>
      <div class="err" id="f-err"></div>
      <button class="btn" id="f-go" data-t="start"></button>
    </div>
  </section>

  <section id="s-intro" class="hide">
    <div class="card">
      <div class="qn" id="i-step"></div>
      <h2 style="margin:6px 0 4px;font-size:22px;line-height:1.25" id="i-title"></h2>
      <div class="intro" id="i-text"></div>
      <p class="muted" style="margin-top:12px" data-t="noBack"></p>
      <div class="sh-help" style="margin-top:12px" id="i-sheet"></div>
      <button class="btn" id="i-go" data-t="begin"></button>
    </div>
  </section>

  <section id="s-q" class="hide">
    <div class="top">
      <div class="t1"><span id="q-sec"></span><span class="timer" id="q-timer">00:00</span></div>
      <div class="bar"><i id="q-bar"></i></div>
    </div>
    <div class="card">
      <div class="qn" id="q-num"></div>
      <div id="q-text"></div>
      <div id="q-body"></div>
      <div class="opts" id="q-opts"></div>
      <div class="nav">
        <button class="btn ghost" id="q-prev" data-t="prev"></button>
        <button class="btn" id="q-next" data-t="next"></button>
      </div>
      <p class="err" id="q-warn"></p>
      <div class="dots" id="q-dots"></div>
    </div>
  </section>

  <section id="s-res" class="hide">
    <div class="card">
      <div class="qn" data-t="resTitle"></div>
      <div class="big"><b id="r-score"></b><small id="r-max"></small></div>
      <div class="scale" id="r-scale"></div>
      <div id="r-badges"></div>
      <p style="margin-top:12px;font-weight:600;line-height:1.5" id="r-msg"></p>
      <p class="muted" style="margin-top:10px" id="r-approx"></p>
    </div>
    <div class="card"><h3 class="h" data-t="bySec"></h3><div class="rows" id="r-secs"></div><p class="muted" style="margin-top:10px" data-t="legend"></p></div>
    <div class="card"><h3 class="h" data-t="byTopic"></h3><div id="r-topics"></div><div id="r-tips"></div></div>
    <div class="card"><h3 class="h" data-t="mistakes"></h3><div id="r-review"></div></div>
    <div class="card">
      <div class="cta" style="margin-top:0">
        <h3 data-t="ctaH"></h3>
        <p data-t="ctaP"></p>
        <a class="btn" id="r-ig" href="https://ig.me/m/novaup.kg" target="_blank" rel="noopener" data-t="ctaBtn"></a>
      </div>
      <button class="btn ghost" id="r-again" data-t="again"></button>
    </div>
  </section>

  <footer data-t="foot"></footer>
</div>

<div class="sheetbar hide" id="sheetbar"><div class="in">
  <div class="sb1"><div><div class="cap" data-t="sheetCap"></div><div class="sbn" id="sb-n"></div></div><div class="bub" id="sb-row"></div><button class="sb-all" id="sb-all" data-t="sheetAll"></button></div>
  <div class="sbmsg" id="sb-msg"></div>
</div></div>
<div class="sheetov hide" id="sheet"><div class="sheetbox">
  <div class="sh-h"><b id="sh-title"></b><button id="sh-x">✕</button></div>
  <div class="sh-help" id="sh-help"></div>
  <div class="sbmsg" id="sh-msg" style="margin-bottom:6px"></div>
  <div class="sh-grid" id="sh-grid"></div>
</div></div>

<script src="questions.js"></script>
<script>
{
// ===== Куда отправлять заявки (пусто = только в браузере) =====
const LEAD_URL = 'https://script.google.com/macros/s/AKfycbwmvsKHBz55-oOkNvyMg7IjyFrIWhC7dmpXoFT6-Vpl9ygsacwTkKRjFyiSSivb-3q2yA/exec';

  norms: ['Сүйлөмдүн туура түзүлүшү', 'Нормы построения предложений', 'Сөздөрдүн байланышын жана сүйлөмдөгү сөз тартибин текшериңиз.', 'Проверяйте согласование, управление и деепричастные обороты.'],
  fill: ['Ылайыктуу сөздү коюу', 'Подбор подходящего слова', 'Сүйлөмдүн маанисине жана грамматикасына эң так келген сөздү тандаңыз.', 'Выбирайте слово, точно подходящее и по смыслу, и по грамматике.']
};
const L = ['А', 'Б', 'В', 'Г', 'Д'];
// примерный перевод доли верных ответов в шкалу ОРТ (по распределению ЦООМО: среднее ~120, σ ~32, максимум 245)
const ANCH = [[0, 40], [0.25, 72], [0.4, 98], [0.5, 115], [0.6, 132], [0.7, 152], [0.8, 174], [0.9, 202], [0.96, 226], [1, 240]];
const toScale = p => { for (let i = 1; i < ANCH.length; i++) if (p <= ANCH[i][0]) { const [x0, y0] = ANCH[i - 1], [x1, y1] = ANCH[i]; return Math.round(y0 + (y1 - y0) * (p - x0) / (x1 - x0)); } return 240; };
const cdf = z => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2), p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; };

let ui = 'ky';
const st = { lead: {}, tl: null, mode: 'full', fill: 'sheet', sec: 0, q: 0, ans: {}, mark: {}, endAt: 0, timer: null, started: 0, used: {}, secStart: 0, armed: false, textOpen: true, phase: '' };
const RUN = 'ort_run_v2';
function save() { try { const { timer, armed, ...d } = st; localStorage.setItem(RUN, JSON.stringify(d)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(RUN) || 'null'); } catch (e) { return null; } }
const clearRun = () => { try { localStorage.removeItem(RUN); } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tx = v => v == null ? '' : typeof v === 'string' ? v : (v[st.tl] ?? v.ru ?? '');
const secs = () => ORT.sections;
const itemsAll = s => s.items || (s.byLang[st.tl].items || s.byLang[st.tl]);
const items = s => st.mode === 'full' ? itemsAll(s) : itemsAll(s).filter(x => !x.full);
const mins = s => s.minutes[st.mode] ?? s.minutes;
const sheetMode = () => st.fill === 'sheet';
const texts = s => s.byLang && s.byLang[st.tl].texts;
const keyOf = (s, i) => s.id + ':' + i;

function applyUI() {
  document.documentElement.lang = ui;
  document.querySelectorAll('[data-t]').forEach(el => { const v = T[ui][el.dataset.t]; if (typeof v === 'string') el.innerHTML = v; });
  const r = $('#f-region'), cur = r.selectedIndex;
  r.innerHTML = `<option value="">${T[ui].pick}</option>` + T[ui].regions.map((x, i) => `<option value="${T.ky.regions[i]}">${x}</option>`).join('');
  r.selectedIndex = Math.max(cur, 0);
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === ui));
  if (!$('#s-form').classList.contains('hide')) resumeCard();
  if (!$('#s-intro').classList.contains('hide')) showIntro();
  if (!$('#s-q').classList.contains('hide')) renderQ();
  if (!$('#s-res').classList.contains('hide')) results(true);
  if (!$('#sheet').classList.contains('hide')) openSheet();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { ui = b.dataset.l; applyUI(); });
function seg(id) { document.querySelectorAll(id + ' button').forEach(b => b.onclick = () => { document.querySelectorAll(id + ' button').forEach(x => x.classList.remove('on')); b.classList.add('on'); if (id === '#f-tlang') { ui = b.dataset.v; applyUI(); } }); }
seg('#f-class'); seg('#f-tlang'); seg('#f-mode'); seg('#f-fill');
const segVal = id => { const b = $(id + ' button.on'); return b ? (b.dataset.v || b.textContent) : ''; };
function show(id) {
  ['#s-form', '#s-intro', '#s-q', '#s-res'].forEach(s => $(s).classList.toggle('hide', s !== id));
  const sb = id === '#s-q' && sheetMode();
  $('#sheetbar').classList.toggle('hide', !sb); document.body.classList.toggle('sheetmode', sb);
  if (!sb) $('#sheet').classList.add('hide');
  scrollTo(0, 0);
}

async function sendLead(extra) {
  const data = { ...st.lead, ...extra, page: location.href, ts: new Date().toISOString() };
  try { const all = JSON.parse(localStorage.getItem('ort_leads') || '[]'); all.push(data); localStorage.setItem('ort_leads', JSON.stringify(all)); } catch (e) {}
  if (!LEAD_URL) return;
  try { await fetch(LEAD_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) }); } catch (e) {}
}

$('#f-go').onclick = () => {
  const t = T[ui], name = $('#f-name').value.trim(), digits = $('#f-phone').value.replace(/\D/g, '');
  const cls = segVal('#f-class'), reg = $('#f-region').value, city = $('#f-city').value.trim(), tl = segVal('#f-tlang');
  const err = !name ? t.errName : (digits.length < 9 || digits.length > 12) ? t.errPhone : !cls ? t.errClass : !reg ? t.errRegion : !city ? t.errCity : !tl ? t.errLang : !$('#f-ok').checked ? t.errOk : '';
  $('#f-err').textContent = err; if (err) return;
  st.lead = { name, phone: $('#f-phone').value.trim(), class: cls, region: reg, city, test_lang: tl };
  st.tl = tl; st.mode = segVal('#f-mode') || 'full'; st.fill = segVal('#f-fill') || 'sheet';
  st.sec = 0; st.ans = {}; st.mark = {}; st.used = {}; st.started = Date.now();
  st.lead.mode = st.mode === 'full' ? 'полный' : 'короткий'; st.lead.fill = sheetMode() ? 'лист ответов' : 'в вопросе';
  sendLead({ stage: 'анкета' });
  showIntro();
};

function showIntro() {
  const s = secs()[st.sec], t = T[ui];
  $('#i-step').textContent = t.step(st.sec + 1, secs().length);
  $('#i-title').textContent = tx(s.title);
  $('#i-text').textContent = tx(s.intro[st.mode] || s.intro);
  $('#i-sheet').innerHTML = t.sheetHelp; $('#i-sheet').classList.toggle('hide', !sheetMode());
  st.phase = 'intro'; save();
  show('#s-intro');
}
$('#i-go').onclick = () => { st.q = 0; st.textOpen = true; st.secStart = Date.now(); st.endAt = Date.now() + mins(secs()[st.sec]) * 60000; st.phase = 'q'; save(); startTimer(); renderQ(); show('#s-q'); };

function startTimer() {
  clearInterval(st.timer);
  const tick = () => {
    const left = Math.max(0, Math.round((st.endAt - Date.now()) / 1000));
    const m = Math.floor(left / 60), s = left % 60;
    $('#q-timer').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    $('#q-timer').classList.toggle('low', left <= 60);
    if (left <= 0) { clearInterval(st.timer); nextSection(); }
  };
  tick(); st.timer = setInterval(tick, 1000);
}

function textHTML(tt) {
  let n = 0;
  return `<h4>${esc(tt.title || '')}</h4>` + (tt.intro ? `<p class="muted" style="margin-bottom:8px">${esc(tt.intro)}</p>` : '') +
    tt.parts.map(p => { n = 0; return (p.label ? `<h4>${esc(p.label)}</h4>` : '') + p.lines.map(l => { n++; return `<div class="ln"><i>${n % 5 === 0 ? n : ''}</i><span>${esc(l)}</span></div>`; }).join(''); }).join('');
}

function renderQ() {
  st.armed = false; $('#q-warn').textContent = '';
  const s = secs()[st.sec], its = items(s), it = its[st.q], t = T[ui], key = keyOf(s, st.q);
  $('#q-sec').textContent = tx(s.title);
  $('#q-num').innerHTML = esc(t.qnum(st.q + 1, its.length)) + (it.part ? `<span class="part">${it.part === 1 ? t.part1 : t.part2}</span>` : '');
  // текст для чтения
  const tt = texts(s);
  if (tt && it.text !== undefined) {
    $('#q-text').innerHTML = `<button class="txtbtn" id="q-tt">${st.textOpen ? t.hideText : t.showText} <span>${st.textOpen ? '▲' : '▼'}</span></button>` + (st.textOpen ? `<div class="text">${textHTML(tt[it.text])}</div>` : '');
    $('#q-tt').onclick = () => { st.textOpen = !st.textOpen; renderQ(); };
  } else $('#q-text').innerHTML = '';
  let h = '';
  if (it.cond) h += `<div class="cond">${esc(tx(it.cond))}</div>`;
  if (it.kind === 'cmp') h += `<div class="cmp"><div><b>${t.colA}</b><span>${esc(tx(it.A))}</span></div><div><b>${t.colB}</b><span>${esc(tx(it.B))}</span></div></div>`;
  if (it.pair) h += `<div class="pair">${esc(tx(it.pair))}</div>`;
  if (it.q) h += `<div class="qtext">${esc(tx(it.q))}</div>`;
  $('#q-body').innerHTML = h;
  const opts = it.kind === 'cmp' ? t.cmpO : it.o.map(tx);
  if (sheetMode()) {
    $('#q-opts').innerHTML = opts.map((o, i) => `<div class="opt ro"><span class="l">${L[i]}</span><span>${esc(o)}</span></div>`).join('') + `<p class="booknote">${esc(t.bookNote)}</p>`;
    sheetBar();
  } else {
    $('#q-opts').innerHTML = opts.map((o, i) => `<button class="opt ${st.ans[key] === i ? 'on' : ''}" data-i="${i}"><span class="l">${L[i]}</span><span>${esc(o)}</span></button>`).join('');
    $('#q-opts').querySelectorAll('.opt').forEach(b => b.onclick = () => { st.ans[key] = +b.dataset.i; save(); $('#q-opts').querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b)); dots(); progress(); });
  }
  $('#q-prev').style.visibility = st.q ? 'visible' : 'hidden';
  $('#q-next').textContent = st.q === its.length - 1 ? t.finishSec : t.next;
  dots(); progress();
}
// ===== лист ответов =====
const nOpts = it => it.kind === 'cmp' ? 4 : it.o.length;
function bubHTML(s, i) {
  const m = st.mark[keyOf(s, i)] || {}, it = items(s)[i];
  return Array.from({ length: nOpts(it) }, (_, j) => `<button data-q="${i}" data-j="${j}" class="${m.f === j ? 'f' : ''} ${m.x === j ? 'sq' : ''}">${L[j]}</button>`).join('');
}
function markAns(i, j, msgEl) {
  const s = secs()[st.sec], key = keyOf(s, i), m = st.mark[key];
  msgEl.textContent = '';
  if (!m) st.mark[key] = { f: j };
  else if (m.x === undefined) { if (j === m.f) return false; m.x = j; }
  else { if (j !== m.x) msgEl.textContent = T[ui].noFix(i + 1); return false; }
  const mm = st.mark[key]; st.ans[key] = mm.x ?? mm.f; save(); dots(); progress(); return true;
}
function sheetBar() {
  const s = secs()[st.sec];
  $('#sb-n').textContent = '№' + (st.q + 1);
  $('#sb-msg').textContent = '';
  $('#sb-row').innerHTML = bubHTML(s, st.q);
  $('#sb-row').querySelectorAll('button').forEach(b => b.onclick = () => {
    if (markAns(+b.dataset.q, +b.dataset.j, $('#sb-msg'))) { const keep = $('#sb-msg').textContent; sheetBar(); $('#sb-msg').textContent = keep; }
  });
}
function openSheet() {
  const s = secs()[st.sec], its = items(s), t = T[ui];
  $('#sh-title').textContent = t.sheetTitle(tx(s.title));
  $('#sh-help').innerHTML = t.sheetHelp;
  let h = '', part = 0;
  its.forEach((it, i) => {
    if (it.part && it.part !== part) { part = it.part; h += `<div class="sh-sub">${part === 1 ? t.part1s : t.part2s}</div>`; }
    h += `<div class="sh-row ${i === st.q ? 'cur' : ''}"><span>${i + 1}</span><div class="bub">${bubHTML(s, i)}</div></div>`;
  });
  const wasOpen = !$('#sheet').classList.contains('hide'), sc = $('.sheetbox').scrollTop;
  $('#sh-grid').innerHTML = h;
  $('#sh-grid').querySelectorAll('.bub button').forEach(b => b.onclick = () => {
    if (markAns(+b.dataset.q, +b.dataset.j, $('#sh-msg'))) b.parentElement.innerHTML = bubHTML(s, +b.dataset.q), openSheet();
  });
  $('#sheet').classList.remove('hide');
  if (wasOpen) $('.sheetbox').scrollTop = sc;
  else { $('#sh-msg').textContent = ''; const cur = $('#sh-grid .cur'); if (cur) cur.scrollIntoView({ block: 'center' }); }
}
$('#sb-all').onclick = openSheet;
const closeSheet = () => { $('#sheet').classList.add('hide'); sheetBar(); };
$('#sh-x').onclick = closeSheet;
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };

function dots() {
  const s = secs()[st.sec], its = items(s);
  $('#q-dots').innerHTML = its.map((_, i) => `<button class="${st.ans[keyOf(s, i)] !== undefined ? 'done' : ''} ${i === st.q ? 'cur' : ''}">${i + 1}</button>`).join('');
  $('#q-dots').querySelectorAll('button').forEach((b, i) => b.onclick = () => go(i));
}
function progress() {
  const total = secs().reduce((a, x) => a + items(x).length, 0);
  $('#q-bar').style.width = (Object.keys(st.ans).length / total * 100) + '%';
}
function go(i) {
  const s = secs()[st.sec], its = items(s);
  if (texts(s) && its[i].text !== its[st.q].text) st.textOpen = true;
  st.q = i; save(); renderQ(); scrollTo(0, 0);
}
$('#q-prev').onclick = () => { if (st.q) go(st.q - 1); };
$('#q-next').onclick = () => {
  const s = secs()[st.sec], its = items(s);
  if (st.q < its.length - 1) { go(st.q + 1); return; }
  if (st.armed) { nextSection(); return; }
  const miss = its.filter((_, i) => st.ans[keyOf(s, i)] === undefined).length;
  st.armed = true; $('#q-next').textContent = T[ui].confirmBtn; $('#q-warn').textContent = T[ui].confirmSec(miss);
};
function nextSection() {
  clearInterval(st.timer); $('#sheet').classList.add('hide');
  const s = secs()[st.sec];
  st.used[s.id] = Math.min(mins(s), Math.ceil((Math.min(Date.now(), st.endAt) - st.secStart) / 60000));
  if (st.sec < secs().length - 1) { st.sec++; showIntro(); } else results();
}

function results(rerender) {
  const t = T[ui], li = ui === 'ky' ? 0 : 1; let ok = 0, n = 0; const tp = {}, wrong = [], per = [];
  $('#r-secs').innerHTML = secs().map(s => {
    let c = 0; const its = items(s);
    const cells = its.map((it, i) => {
      const a = st.ans[keyOf(s, i)], good = a === it.a;
      if (good) c++;
      (tp[it.topic] = tp[it.topic] || [0, 0])[1]++; if (good) tp[it.topic][0]++;
      if (!good) wrong.push({ s, it, i, a });
      return `<span class="${a === undefined ? 's' : good ? 'y' : 'n'}">${i + 1}</span>`;
    }).join('');
    ok += c; n += its.length; per.push(`${s.id} ${c}/${its.length}`);
    return `<div class="rw"><div class="h"><span>${esc(tx(s.title))}</span><span>${c} / ${its.length}</span></div><div class="b"><i style="width:${c / its.length * 100}%"></i></div><div class="s">${t.time(st.used[s.id] ?? mins(s), mins(s))}</div><div class="cells">${cells}</div></div>`;
  }).join('');
  const p = ok / n, score = toScale(p), pct = Math.min(99, Math.max(1, Math.round(cdf((score - 119.9) / 32) * 100)));
  $('#r-score').textContent = score; $('#r-max').textContent = '/ 245';
  const pos = v => (v / 245 * 100) + '%';
  $('#r-scale').innerHTML = `<div class="me" style="left:${pos(score)}"></div>` + [[110, '110'], [150, '150'], [200, '200'], [230, '230 🏅']].map(([v, l]) => `<span class="mk" style="left:${pos(v)}">${l}</span>`).join('');
  $('#r-badges').innerHTML = `<span class="badge ${score >= 110 ? 'ok' : 'no'}">${score >= 110 ? t.pass : t.fail}</span><span class="badge g">${t.better(pct)}</span><span class="badge g">${t.raw(ok, n)}</span>`;
  $('#r-msg').textContent = t.msg(score);
  $('#r-approx').textContent = t.approx + (st.mode === 'short' ? t.half : '');
  const list = Object.entries(tp).map(([k, [c, m]]) => ({ k, c, m, r: c / m })).sort((a, b) => a.r - b.r);
  $('#r-topics').innerHTML = list.map(x => { const col = x.r >= .75 ? 'var(--ok)' : x.r >= .5 ? 'var(--gold2)' : 'var(--bad)'; return `<div class="tp"><span>${esc(TOPIC[x.k] ? TOPIC[x.k][li] : x.k)}</span><b style="color:${col}">${x.c}/${x.m}</b><div class="b"><i style="width:${x.r * 100}%;background:${col}"></i></div></div>`; }).join('');
  const weak = list.filter(x => x.r < .75).slice(0, 4);
  $('#r-tips').innerHTML = weak.length ? `<h3 class="h" style="margin-top:16px">${t.weak}</h3>` + weak.map(x => `<div class="tip"><b>${esc(TOPIC[x.k][li])}.</b> ${esc(TOPIC[x.k][li + 2])}</div>`).join('') : '';
  const optTxt = (it, i) => i === undefined ? t.none : `${L[i]}) ${it.kind === 'cmp' ? t.cmpO[i] : tx(it.o[i])}`;
  $('#r-review').innerHTML = wrong.length ? wrong.map(w => {
    const st1 = tx(w.it.q) || tx(w.it.pair) || `${t.colA}: ${tx(w.it.A)} · ${t.colB}: ${tx(w.it.B)}`;
    return `<details><summary>${esc(tx(w.s.title))} · №${w.i + 1}: ${esc(st1.length > 90 ? st1.slice(0, 90) + '…' : st1)}</summary><p>${t.your}: <b style="color:var(--bad)">${esc(optTxt(w.it, w.a))}</b><br>${t.right}: <b style="color:var(--ok)">${esc(optTxt(w.it, w.it.a))}</b></p>${w.it.ex ? `<p class="muted">${esc(tx(w.it.ex))}</p>` : ''}</details>`;
  }).join('') : `<p>${t.noMist}</p>`;
  if (!rerender) {
    st.phase = 'done'; clearRun();
    sendLead({ stage: 'результат', ort_score: score, correct: `${ok}/${n}`, sections: per.join('; '), weak_topics: weak.map(x => TOPIC[x.k][1]).join(', '), minutes: Math.round((Date.now() - st.started) / 60000) });
    show('#s-res');
  }
}
$('#r-again').onclick = () => { st.sec = 0; st.ans = {}; st.mark = {}; st.used = {}; st.started = Date.now(); showIntro(); };

// ===== продолжить незаконченный тест =====
function resumeCard() {
  const d = load(), box = $('#resume');
  const sec = d && d.tl && d.phase && d.phase !== 'done' ? ORT.sections[d.sec] : null;
  if (!sec) { box.classList.add('hide'); return; }
  const keep = { tl: st.tl, mode: st.mode }; st.tl = d.tl; st.mode = d.mode;
  const m = items(sec).length; Object.assign(st, keep);
  const n = Object.keys(d.ans || {}).filter(k => k.startsWith(sec.id + ':')).length;
  $('#resume-info').textContent = T[ui].resInfo(tx(sec.title), n, m);
  box.classList.remove('hide');
}
$('#resume-no').onclick = () => { clearRun(); $('#resume').classList.add('hide'); };
$('#resume-go').onclick = () => {
  const d = load(); if (!d) return;
  Object.assign(st, d, { timer: null, armed: false });
  ui = st.tl; document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === ui));
  document.querySelectorAll('[data-t]').forEach(el => { const v = T[ui][el.dataset.t]; if (typeof v === 'string') el.innerHTML = v; });
  if (st.phase === 'q') {
    if (Date.now() >= st.endAt) { nextSection(); return; }
    startTimer(); renderQ(); show('#s-q');
  } else showIntro();
};
applyUI();
}
</script>
</body>
